services:
  bff-api:
    build:
      context: ./api_cloud
      dockerfile: Dockerfile
    container_name: bff-api
    ports:
      - "8088:8088"
    environment:
      - SECURITY_ENABLED=${SECURITY_ENABLED:-true}
      # IP privada o DNS de la instancia EC2 donde corren los microservicios
      - ORDERS_SERVICE_URL=${ORDERS_SERVICE_URL:-http://microservices-instance:8087}
      - MICROSERVICE_BASE_URL=${ORDERS_SERVICE_URL:-http://microservices-instance:8087}
      - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL:-http://microservices-instance:8086}
    restart: unless-stopped
