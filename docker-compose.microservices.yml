services:
  # Microservicio de Catálogo (Expone REST en puerto 8086)
  ms-catalog:
    build:
      context: ./ms-pedidos360-catalog
      dockerfile: Dockerfile
    container_name: pedidos360-catalog
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - DB_HOST=${DB_HOST:-database-instance}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${CATALOG_DB_NAME:-pedidos360_catalog}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
    restart: unless-stopped

  # Microservicio de Órdenes (Expone REST en puerto 8087 y publica eventos en RabbitMQ)
  ms-orders:
    build:
      context: ./ms-pedidos360-orders
      dockerfile: Dockerfile
    container_name: pedidos360-orders
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - DB_HOST=${DB_HOST:-database-instance}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${ORDERS_DB_NAME:-pedidos360_orders}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq-instance}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    restart: unless-stopped

  # Microservicio de Notificaciones (Consumidor AMQP en background y envío de correos)
  ms-notify:
    build:
      context: ./ms-pedidos360-notify
      dockerfile: Dockerfile
    container_name: pedidos360-notify
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq-instance}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - SMTP_HOST=${SMTP_HOST:-mailpit-instance}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_AUTH=${SMTP_AUTH:-false}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
    restart: unless-stopped
