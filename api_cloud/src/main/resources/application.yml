server:
    port: 8088
spring:
  security:
    enabled: ${SECURITY_ENABLED:true}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/pedidos360_auth
    username: ${DB_USER:postgres}
    # BASELINE-VULN [SEC-REQ-012]: clave de base de datos por defecto predecible (postgres)
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# BASELINE-VULN [SEC-REQ-012]: secreto JWT debil por defecto hardcodeado
security:
  jwt:
    secret: ${JWT_SECRET:changeme}
microservice:
  base-url: ${MICROSERVICE_BASE_URL:http://localhost:8087}
  orders-url: ${ORDERS_SERVICE_URL:${MICROSERVICE_BASE_URL:http://localhost:8087}}
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8086}