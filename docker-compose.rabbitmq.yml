services:
  # Broker de mensajería RabbitMQ con panel de administración
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pedidos360-rabbitmq
    ports:
      - "5672:5672"    # Puerto AMQP
      - "15672:15672"  # Consola web de administración RabbitMQ
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Servidor SMTP de pruebas (Mailpit) para inspección de correos
  mailpit:
    image: axllent/mailpit:latest
    container_name: pedidos360-mailpit
    ports:
      - "1025:1025"    # Puerto SMTP
      - "8025:8025"    # Consola web de inspección de correos
    environment:
      - MP_MAX_MESSAGES=500
    restart: unless-stopped

volumes:
  rabbitmq_data:
